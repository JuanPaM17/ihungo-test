[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "*/migrations/*",
    "staticfiles",
    "backend",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "manage.py",
    "*/tests.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/settings.py",
    "staticfiles/*",
    "gunicorn.conf.py",
    "conftest.py",
    "backend/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
